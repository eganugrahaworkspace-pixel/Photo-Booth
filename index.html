<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dari Photobooth</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="booth">
      <div class="preview-wrap">
        <div id="preview" class="preview">
          <video id="video" autoplay playsinline muted></video>
          <img id="twibbon" class="twibbon" src="/twibbon/green.png" alt="" />
          <div id="countdown" class="countdown" hidden></div>
        </div>
      </div>

      <section class="controls" aria-label="Kontrol booth">
        <h1>Dari Photobooth</h1>
        <p id="status" class="status" role="status" aria-live="polite">Menyiapkan kamera…</p>

        <label class="field">
          Twibbon
          <select id="twibbon-select">
            <option value="green" selected>Hijau</option>
            <option value="white">Putih</option>
          </select>
        </label>

        <label class="field" id="camera-label" hidden>
          Kamera
          <select id="camera-select"></select>
        </label>

        <button id="shoot" class="primary" type="button" disabled>Ambil Foto</button>
        <button id="retry" type="button" hidden>Coba lagi</button>
        <button id="next" type="button" hidden>Foto berikutnya</button>

        <form id="key-form" class="key-form" hidden>
          <label class="field">
            Kunci booth
            <input id="key-input" type="password" autocomplete="off" />
          </label>
          <button type="submit">Simpan kunci</button>
        </form>

        <div id="qr-box" class="qr-box" hidden>
          <canvas id="qr" width="240" height="240"></canvas>
          <p>Pindai QR untuk membuka foto.</p>
        </div>

        <p class="notice">Foto disimpan 7 hari lalu dihapus otomatis. Hanya yang punya QR yang bisa membukanya.</p>
      </section>
    </main>
    <script type="module" src="/src/booth.ts"></script>
  </body>
</html>
